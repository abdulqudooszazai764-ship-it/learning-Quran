<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050"><defs><style>.bg{fill:#f8f5ec}.card{fill:#fffdf8;stroke:#c9b477;stroke-width:2}.head{fill:#123d32}.ht{font:700 18px Arial;fill:#fff}.field{font:15px Arial;fill:#24372f}.title{font:700 31px Georgia;fill:#123d32}.sub{font:16px Arial;fill:#617269}.rel{stroke:#a7833f;stroke-width:2.5;fill:none}.label{font:13px Arial;fill:#123d32;font-weight:bold}</style></defs><rect class="bg" width="1500" height="1050"/><text x="750" y="54" text-anchor="middle" class="title">Haseen Academy — Relational Data Model</text><text x="750" y="82" text-anchor="middle" class="sub">PostgreSQL · Django ORM · Foreign-key relationships · No payment data</text>
